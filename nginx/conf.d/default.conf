# Edge reverse proxy. Terminate TLS in front of this container (or add a 443 server block) and keep
# X-Forwarded-Proto = https; Django trusts it only because the backend is not reachable from outside.
limit_req_zone $binary_remote_addr zone=api:10m rate=20r/s;
limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;

server {
    listen 80;
    server_name _;

    client_max_body_size 26M;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    location = /api/auth/token/ {
        limit_req zone=login burst=5 nodelay;
        include /etc/nginx/conf.d/proxy_backend.inc;
    }

    location /api/ {
        limit_req zone=api burst=40 nodelay;
        proxy_read_timeout 120s;
        include /etc/nginx/conf.d/proxy_backend.inc;
    }

    location /static/ {
        alias /static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Files are NEVER served directly: Django authorises, then answers with X-Accel-Redirect.
    location /protected-media/ {
        internal;
        alias /media/;
        add_header Cache-Control "private, no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        proxy_pass http://frontend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $proxy_proto;
    }
}
